<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Password Generator by Mattias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Web Password Generator</h1>
        <h2 class="subtitle">by Mattias</h2>

        <div id="info-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2>Help & Info</h2>
                <div id="info-text"></div>
                <button class="modal-close-button">Close</button>
            </div>
        </div>

        <div class="header-controls">
            <button id="btn-toggle-theme" class="control-button">Toggle Dark/Light Mode</button>
            <button id="btn-show-info" class="control-button">Info</button>
        </div>
        <div id="message-area" class="message-area hidden"></div>

        <div class="input-grid">
            <label for="length-input">Password Length:</label>
            <input type="number" id="length-input" value="14" min="1" max="999">

            <label for="punctuation-input">Punctuation Chars:</label>
            <input type="number" id="punctuation-input" value="2" min="0" max="999">

            <label for="digits-input">Digits:</label>
            <input type="number" id="digits-input" value="2" min="0" max="999">

            <label for="capitals-input">Capitals:</label>
            <input type="number" id="capitals-input" value="2" min="0" max="999">

            <label for="specific-word-input">Specific Word (Optional):</label>
            <input type="text" id="specific-word-input" maxlength="50">

            <label for="num-passwords-input">Number of Passwords:</label>
            <input type="number" id="num-passwords-input" value="1" min="1" max="999">
        </div>

        <div class="options-bar">
            <div class="checkbox-group">
                <input type="checkbox" id="disambiguate-check">
                <label for="disambiguate-check">Disambiguate (avoid I,l,1,0,O,o)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="simple-punc-check">
                <label for="simple-punc-check">Simple Punctuation (!?._@)</label>
            </div>
        </div>

        <div class="button-bar">
            <button id="btn-create">Create Password(s)</button>
            <button id="btn-copy-selected" disabled>Copy Selected</button>
            <button id="btn-copy-all" disabled>Copy All</button>
            <button id="btn-evaluate" disabled>Evaluate Selected</button>
            <button id="btn-clear">Reset Fields</button> </div>

        <div class="output-area">
            <label>Generated Passwords:</label>
            <select id="passwords-select" size="10" multiple>
                </select>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
